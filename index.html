<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duelo de Presentes</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    background:#0e1015;
    color:#fff;
    font-family:Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
}

.game{
    width:min(1000px,94vw);
    text-align:center;
}

h1{
    font-size:clamp(26px,5vw,46px);
    margin:0 0 8px;
}

.sub{
    opacity:.7;
    margin:0 0 26px;
}

.bar{
    height:90px;
    border-radius:18px;
    overflow:hidden;
    display:flex;
    background:#292c33;
    box-shadow:0 10px 35px #0008;
}

.side{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:clamp(16px,3vw,30px);
    transition:width .35s ease;
    min-width:0;
    overflow:hidden;
    white-space:nowrap;
}

.red{
    background:#d71920;
}

.blue{
    background:#1769e0;
}

.cards{
    display:flex;
    gap:14px;
    justify-content:center;
    margin:22px auto 0;
    flex-wrap:wrap;
}

.card{
    width:310px;
    background:#181b21;
    border-radius:15px;
    padding:14px;
}

.card-title{
    font-weight:bold;
    margin-bottom:12px;
}

.mini{
    display:flex;
    justify-content:center;
    gap:25px;
}

.miniItem{
    width:110px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    cursor:pointer;
    user-select:none;
    transition:.15s;
}

.miniItem:hover{
    transform:scale(1.08);
}

.miniItem:active{
    transform:scale(.92);
}

.gift{
    width:65px;
    height:65px;
    object-fit:contain;
}

.coin{
    font-size:11px;
    opacity:.65;
}

.name{
    font-size:12px;
    font-weight:bold;
}

.reset{
    margin-top:20px;
    border:0;
    border-radius:10px;
    padding:12px 20px;
    background:#292c34;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.reset:hover{
    background:#383c46;
}

.log{
    margin-top:15px;
    font-size:12px;
    opacity:.55;
    min-height:18px;
}

@media(max-width:600px){
    .bar{
        height:75px;
    }

    .card{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="game">

    <h1>Quem você escolheria?</h1>

    <p class="sub">
        Clique nos presentes para testar os votos.
    </p>

    <div class="bar">

        <
