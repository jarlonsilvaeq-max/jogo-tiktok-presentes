<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Duelo de Presentes — TikTok LIVE</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
background:#0e1015;
color:#fff;
font-family:Arial,sans-serif;
display:flex;
align-items:center;
justify-content:center
}

.game{
width:min(900px,94vw);
text-align:center
}

.status{
font-size:12px;
opacity:.55;
margin-bottom:12px
}

h1{
font-size:clamp(25px,5vw,42px);
margin:0 0 7px
}

.sub{
font-size:13px;
opacity:.55;
margin:0 0 22px
}

/* RESULTADO */

.bar{
height:72px;
border-radius:14px;
overflow:hidden;
display:flex;
background:#292c33;
box-shadow:0 8px 25px #0007
}

.side{
height:100%;
display:flex;
align-items:center;
justify-content:center;
font-weight:800;
font-size:clamp(16px,2.8vw,25px);
transition:width .35s;
min-width:0;
white-space:nowrap
}

.red{background:#d71920}
.blue{background:#1769e0}

/* CARDS */

.cards{
display:flex;
gap:10px;
justify-content:center;
margin:18px auto 0;
flex-wrap:wrap
}

.card{
width:260px;
background:#181b21;
border-radius:12px;
padding:10px 12px
}

.card b{
display:block;
font-size:14px;
margin-bottom:8px
}

.mini{
display:flex;
justify-content:center;
gap:24px
}

.miniItem{
display:flex;
flex-direction:column;
align-items:center;
gap:3px
}

.gift{
width:48px;
height:48px;
object-fit:contain
}

.giftName{
font-size:10px;
opacity:.75
}

.coin{
font-size:9px;
opacity:.5
}

.reset{
margin-top:15px;
border:0;
border-radius:8px;
padding:9px 15px;
background:#292c34;
color:#fff;
font-size:12px;
font-weight:bold;
cursor:pointer
}

.log{
margin-top:11px;
font-size:11px;
opacity:.45
}
</style>
</head>

<body>

<div class="game">

<div id="status" class="status">
Aguardando conexão com o servidor…
</div>

<h1>Quem você escolheria?</h1>

<p class="sub">
Presentes da LIVE viram votos.
</p>


<!-- RESULTADO -->

<div class="bar">

<div id="l"
class="side red"
style="width:50%">
<span>Lula 50%</span>
</div>

<div id="f"
class="side blue"
style="width:50%">
<span>Flávio Bolsonaro 50%</span>
</div>

</div>


<!-- PRESENTES -->

<div class="cards">


<!-- LULA -->

<div class="card">

<b>🔴 Lula</b>

<div class="mini">


<!-- ROSE -->

<div class="miniItem">

<img
id="cardL1"
class="gift"
alt="Rose"
src="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/eba3a9bb85c33e017f3648eaf88d7189~tplv-obj.webp"
>

<span class="giftName">
Rose
</span>

<span class="coin">
1 moeda • 1 voto
</span>

</div>


<!-- BOUQUET FLOWER -->

<div class="miniItem">

<img
id="cardL20"
class="gift"
alt="Bouquet Flower"
src="https://beetgames.com/images/gifts/bouquet_flower.webp"
>

<span class="giftName">
Bouquet Flower
</span>

<span class="coin">
30 moedas • 20 votos
</span>

</div>

</div>

</div>


<!-- FLÁVIO -->

<div class="card">

<b>🔵 Flávio Bolsonaro</b>

<div class="mini">


<!-- FIRE -->

<div class="miniItem">

<img
id="cardF1"
class="gift"
alt="Fire"
src="https://beetgames.com/images/gifts/fire.webp"
>

<span class="giftName">
Fire
</span>

<span class="coin">
1 moeda • 1 voto
</span>

</div>


<!-- DOUGHNUT -->

<div class="miniItem">

<img
id="cardF20"
class="gift"
alt="Doughnut"
src="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/4e7ad6bdf0a1d860c538f38026d4e812~tplv-obj.webp"
>

<span class="giftName">
Doughnut
</span>

<span class="coin">
30 moedas • 20 votos
</span>

</div>

</div>

</div>

</div>


<button class="reset" onclick="reset()">
Nova rodada
</button>

<div id="log" class="log">
Aguardando presentes…
</div>

</div>


<script>

let p=50;


/*
PRESENTES

Rose
ID: 5655
1 moeda
1 voto

Bouquet Flower
ID: 5780
30 moedas
20 votos

Doughnut
ID: 5879
30 moedas
20 votos

Fire
1 moeda
1 voto
*/


const GIFT_IDS={

rose:5655,

bouquet:5780,

doughnut:5879

};


/* ATUALIZA RESULTADO */

function render(){

p=Math.max(0,Math.min(100,p));

let q=100-p;

document.getElementById("l").style.width=
p+"%";

document.getElementById("f").style.width=
q+"%";

document.querySelector("#l span").textContent=
"Lula "+p+"%";

document.querySelector("#f span").textContent=
"Flávio Bolsonaro "+q+"%";

}


/* VOTO */

function vote(candidate,votes){

if(candidate==="lula"){

p+=votes;

}else{

p-=votes;

}

render();

}


/* RESET */

function reset(){

p=50;

render();

document.getElementById("log").textContent=
"Nova rodada — aguardando presentes…";

}


/*
TROCA O ÍCONE PELO ÍCONE REAL
QUE O SERVIDOR ENVIAR
*/

function setIcon(id,url){

if(!url)return;

const el=document.getElementById(id);

if(!el)return;

el.src=url;

}


/* IDENTIFICA O PRESENTE */

function identifyGift(d){

const name=
String(
d.giftName ||
d.gift ||
d.name ||
""
)
.toLowerCase()
.trim();


const id=
Number(
d.giftId ||
d.id ||
0
);


/* ROSE */

if(
id===GIFT_IDS.rose ||
name==="rose"
){

return{

candidate:"lula",

votes:1,

card:"cardL1",

label:"Rose"

};

}


/* BOUQUET FLOWER */

if(
id===GIFT_IDS.bouquet ||
name==="bouquet flower" ||
name==="bouquetflower" ||
name==="bouquet"
){

return{

candidate:"lula",

votes:20,

card:"cardL20",

label:"Bouquet Flower"

};

}


/* DOUGHNUT */

if(
id===GIFT_IDS.doughnut ||
name==="doughnut"
){

return{

candidate:"flavio",

votes:20,

card:"cardF20",

label:"Doughnut"

};

}


/* FIRE */

if(
name==="fire" ||
name==="fogo"
){

return{

candidate:"flavio",

votes:1,

card:"cardF1",

label:"Fire"

};

}


return null;

}


/* CONEXÃO */

function connect(){

const ws=
new WebSocket(
(location.protocol==="https:"
?"wss://"
:"ws://")
+
location.host
);


ws.onopen=function(){

document.getElementById("status").textContent=
"● Conectado — aguardando presentes do TikTok LIVE";

};


ws.onclose=function(){

document.getElementById("status").textContent=
"○ Servidor desconectado — reconectando…";

setTimeout(connect,2500);

};


ws.onmessage=function(e){

try{

const d=JSON.parse(e.data);


/*
ACEITA:

{
type:"gift",
giftName:"Fire"
}

OU

{
type:"gift",
giftId:5655,
giftName:"Rose"
}
*/

if(d.type!=="gift")return;


/* IDENTIFICA */

const gift=
identifyGift(d);


/*
SE O SEU SERVIDOR JÁ ENVIA
candidate + votes, TAMBÉM ACEITA
ESSE FORMATO.
*/

if(!gift && d.candidate){

vote(
d.candidate,
Number(d.votes||0)
);

return;

}


if(!gift)return;


/* REGISTRA VOTO */

vote(
gift.candidate,
gift.votes
);


/*
SE O SERVIDOR MANDAR O ÍCONE
REAL DO TIKTOK, USA ELE.

ACEITA:
d.icon
d.giftPictureUrl
d.giftIcon
d.iconUrl
*/

const icon=
d.icon ||
d.giftPictureUrl ||
d.giftIcon ||
d.iconUrl;


/* ATUALIZA ÍCONE */

if(icon){

setIcon(
gift.card,
icon
);

}


/* LOG */

const user=
d.user?.uniqueId ||
d.user?.nickname ||
d.username ||
d.user ||
"Usuário";


document.getElementById("log").textContent=
"🎁 "+
user+
" enviou "+
gift.label+
" — "+
gift.votes+
" voto(s)";


}catch(error){

console.log(
"Erro no presente:",
error
);

}

};

}


/* INICIA */

connect();

render();

</script>

</body>
</html>
